name: Domain baseline gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  domain-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run domain-baseline:check
      - run: npm run domain-baseline:test
      - run: npm run typecheck:server
